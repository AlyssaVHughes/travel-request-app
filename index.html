<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/app.css">
    <link rel="stylesheet" href="../CSS/side_menu.css">
    <link rel="stylesheet" href="../CSS/header.css">  
    <link rel="stylesheet" href="../CSS/dashboard.css">  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <script src="../JS/sampleData.js" defer></script>
    <script src="../JS/navigation.js" defer></script>
    <script src="../JS/pages/dashboard.js" defer></script>

    <title>Travel Request App</title>
</head>
<body>

    <div class="app"> 

        <div class="sidebar"> 
            <div class="sidebar-header"> 
                <img src="../images/icons/close_icon.png" alt="Logo" class="sidebar-logo">
            </div>

            <button class="sidebar-button active"> <img src="../images/icons/quickview_icon.png" class= button-icon-inactive> <span class="button-text">Home</span></button>
            <button class="sidebar-button"> <img src="../images/icons/new_icon.png" class= button-icon-inactive> <span class="button-text">New Request</span></button>
            <button class="sidebar-button"> <img src="../images/icons/dashboard_icon.png" class= button-icon-inactive> <span class="button-text">Request Dashboard</span></button>
            <button class="sidebar-button"> <img src="../images/icons/approval_icon.png" class= button-icon-inactive> <span class="button-text">Approvals</span> <div class="approval-notif"> 2 </div></button>
            <button class="sidebar-button"> <img src="../images/icons/budget_icon.png" class= button-icon-inactive><span class="button-text">My Budget</span></button>

        </div>

        <div class="right-content">

            <div class="header">

                <div class="header-logo">
                    <img src="../Images/Icons/app_logo.png" alt="Logo" class="app-logo">
                    <h1 class="app-name">PLACEHOLDER</h1>
                </div>

                <div class="signIn">
                    <span class="user-name">User Name</span>
                    <img src="../images/icons/profile_icon.png" alt="User Icon" class="user-icon">
                </div>

            </div>

            <div class="dashboard-area"> 

                <div class="dashboard-header"> 
                    
                    <div class="tab-area"> 
                        <div class="tab active"> <span class="tab-text">All Requests</span> </div>
                        <div class="tab"> <span class="tab-text">Upcoming Requests</span> </div>
                        <div class="tab"> <span class="tab-text">Past Requests</span> </div>
                    </div>


                </div>

                <div class="table-area"> 
                    <div class ="table-header"> 
                    <div class="filter-area">
                        <div class="search-container">
                            <img src="../Images/Icons/search_icon.png" alt="Search" class="search-icon">
                            <input
                                type="text"
                                class="search-input"
                                placeholder="Search requests...">
                        </div>

                        <!-- <div class="filter-menu">

                            <button class="filter-button">Name <img class="filter-arrow1" src="../Images/Icons/down_arrow.png"></button>

                            <div class="filter-popup">
                                <button>Approved</button>
                                <button>Pending</button>
                                <button>Rejected</button>
                                <button>Clear Filter</button>
                            </div>

                        </div> -->

                        <div class="filter-menu">

                            <button class="filter-button">Start Date <img class="filter-arrow1" src="../Images/Icons/down_arrow.png"></button>

                            <div class="filter-popup">
                                <button class="status-filter" data-filter="startDate" data-value="current">Current Date</button>
                                <button class="status-filter" data-filter="startDate" data-value="before">Before Current Date</button>
                                <button class="status-filter" data-filter="startDate" data-value="after">After Current Date</button>
                            </div>

                        </div>

                        <div class="filter-menu">

                            <button class="filter-button">End Date <img class="filter-arrow1" src="../Images/Icons/down_arrow.png"></button>

                            <div class="filter-popup">
                                <button class="status-filter" data-filter="endDate" data-value="current">Current Date</button>
                                <button class="status-filter" data-filter="endDate" data-value="before">Before Current Date</button>
                                <button class="status-filter" data-filter="endDate" data-value="after">After Current Date</button>
                            </div>

                        </div>

                        <div class="filter-menu">

                            <button class="filter-button">Estimated Cost <img class="filter-arrow1" src="../Images/Icons/down_arrow.png"></button>

                            <div class="filter-popup">
                                <button class="status-filter" data-filter="estimatedCost" data-value="under">Less than $10,000</button>
                                <button class="status-filter" data-filter="estimatedCost" data-value="over">More than $10,000</button>
                            </div>

                        </div>

                        <div class="filter-menu">

                            <button class="filter-button">Request Status <img class="filter-arrow1" src="../Images/Icons/down_arrow.png"></button>

                            <div class="filter-popup">

                                <button class="status-filter" data-filter="status" data-value="New Request">New Request</button>
                                <button class="status-filter" data-filter="status" data-value="Pending Approval">Pending Approval</button>
                                <button class="status-filter" data-filter="status" data-value="Approved">Approved</button>
                                <button class="status-filter" data-filter="status" data-value="Rejected">Rejected</button>

                            </div>

                        </div>

                    </div>

                    <button id="reset-button" class="reset-filters"><img class="filter-arrow1" src="../Images/Icons/refresh_icon.png">  Reset Filters</button>

                    </div>

                    <div class="request-table-container">

                        <table class="request-table">
                    
                            <thead>
                                <tr>
                                    <th>Request ID</th>
                                    <th>Requestor</th>
                                    <th>Destination</th>
                                    <th>Start Date</th>
                                    <th>End Date</th>
                                    <th>Estimated Cost</th>
                                    <th>Status</th>
                                    <th>Purpose For Travel</th>
                                </tr>
                            </thead>
                    
                            <tbody id="request-table-body">                    
                            </tbody>
                    
                        </table>
                    
                    </div>

                </div>

                <div class="pagination-area"> 
                    <button id="previous-page" class="pagination-button"><img src="../Images/Icons/left_previous.png" alt="" class="left"> </button>
                    <p id="page-number" class="pagination-place">1 of 1</p>
                    <button id="next-page" class="pagination-button"><img src="../Images/Icons/right_next.png" alt="" class="left"> </button>
                </div>

            </div>

        </div>

    </div>


</body>
</html>
