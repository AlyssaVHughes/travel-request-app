<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/app.css">
    <link rel="stylesheet" href="../CSS/side_menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <script src="../JS/navigation.js" defer></script>
    <title>Travel Request App</title>
</head>
<body>

    <div class="app"> 

        <div class="sidebar"> 
            <div class="sidebar-header"> 
                <img src="../images/icons/close_icon.png" alt="Logo" class="sidebar-logo">
            </div>

            <button class="sidebar-button active"> <img src="../images/icons/quickview_icon.png" class= button-icon-inactive> <span class="button-text">Home</span></button>
            <button class="sidebar-button"> <img src="../images/icons/new_icon.png" class= button-icon-inactive> <span class="button-text">New Request</span></button>
            <button class="sidebar-button"> <img src="../images/icons/dashboard_icon.png" class= button-icon-inactive> <span class="button-text">Request Dashboard</span></button>
            <button class="sidebar-button"> <img src="../images/icons/approval_icon.png" class= button-icon-inactive> <span class="button-text">Approvals</span></button>
            <button class="sidebar-button"> <img src="../images/icons/budget_icon.png" class= button-icon-inactive><span class="button-text">My Budget</span></button>

        </div>

        <div class="right-content">

            <div class="header">
                <div class="app-logo">
                    <img src="../Images/Icons/app_logo.png" alt="Logo" class="logo">
                </div>
                <div class="header-right">
                    <img src="../images/icons/user_icon.png" alt="User Icon" class="user-icon">
                    <span class="user-name">John Doe</span>
                </div>


        </div>

    </div>


</body>
</html>
